services:
  mysql:
    image: mysql:8.0
    container_name: ottodot-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ottodot
      MYSQL_DATABASE: ottodot
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ottodot-mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pottodot"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  ottodot-mysql-data:
